name = "guidetrack-reimagined"
main = "worker.mjs"
compatibility_date = "2026-11-22"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[[d1_databases]]
binding = "ACCOUNTS"
database_name = "guidetrack-accounts"

[[ratelimits]]
name = "AUTH_LIMIT"
namespace_id = "74613892"
simple = { limit = 10, period = 60 }

[ai]
binding = "AI"

[[ratelimits]]
name = "CHAT_LIMIT"
namespace_id = "74613893"
simple = { limit = 10, period = 60 }
